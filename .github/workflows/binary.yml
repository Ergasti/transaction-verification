name: binary

on:
  pull_request:
    paths: ['ocr-sidecar/**', '.github/workflows/binary.yml']
  push:
    tags: ['v*']

# Action majors: checkout@v7 matches sidecar.yml; the rest are pinned low deliberately. tests.yml still
# uses checkout@v4, so the repo has no single convention -- bump these to whatever is current here.
jobs:
  archive:
    strategy:
      # Every platform reports, so one failure never hides another's state.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, the oldest runner GitHub still offers: the frozen binary links the build host's
          # libc, so building here sets the floor at **glibc 2.35 -- Ubuntu 22.04 and newer**. A newer
          # runner would silently narrow that; `ubuntu-latest` must not be used.
          #
          # manylinux_2_28 would reach further back but cannot be used: its Python is built static, and
          # PyInstaller needs a shared libpython ("Python was built without a shared library").
          #
          # macos-arm64 carries no OpenVINO: install_name_tool rejects its dylibs, so that build runs on ONNX
          # Runtime instead (see build-archive.sh). Developer machines only -- nothing here deploys to a Mac.
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            python: python3
          #
          # macos-15 builds it because GitHub retired macos-14. The build machine does not set the oldest macOS
          # this runs on: the prebuilt numpy and onnxruntime wheels do (14.0), and a step below enforces it.
          - platform: macos-arm64
            runs-on: macos-15
            python: python3
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the archive
        env:
          PYTHON: ${{ matrix.python }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }}
        run: ocr-sidecar/build-archive.sh "$GITHUB_WORKSPACE/out"

      # The point of the job. A clean build still fails if an ONNX or OpenVINO provider was left out, and
      # only running the thing shows it -- so the archive that gets published is one that has read a receipt.
      - name: Read a drawn receipt with the built binary
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" -m pip install --quiet pillow==12.3.0
          tar -xzf out/*.tar.gz -C out
          "$PYTHON" ocr-sidecar/smoke_test.py "$(echo out/tv-ocr-*/tv-ocr)"

      # The smoke test runs on the build machine, so it cannot see a binary that needs that machine's macOS or
      # newer, and GitHub no longer offers an older one to try it on. Every compiled file states its minimum.
      - name: Refuse anything that needs newer than macOS 14
        if: runner.os == 'macOS'
        run: |
          floor=14
          checked=0
          too_new=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            checked=$((checked + 1))
            minos="$(otool -arch arm64 -l "$f" | awk '/LC_BUILD_VERSION/{found=1} found && $1=="minos"{print $2; exit}')"
            if [ -z "$minos" ] || [ "${minos%%.*}" -gt "$floor" ]; then
              echo "::error file=$f::needs macOS ${minos:-unknown}, the floor is $floor"
              too_new=$((too_new + 1))
            fi
          done < <(find out/tv-ocr-*/ -type f -print0)
          echo "$checked compiled files checked, $too_new over macOS $floor"
          [ "$checked" -gt 0 ] && [ "$too_new" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error

  publish:
    needs: archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Downloaded, never rebuilt: the published archive is the one just tested.
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # `gh release upload` does not create, so a tag with no Release yet needs one made first.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" out/*.tar.gz out/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
