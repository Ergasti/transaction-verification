name: sidecar

on:
  pull_request:
    paths: ['ocr-sidecar/**', '.github/workflows/sidecar.yml']
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ergasti/transaction-verification-ocr
          tags: type=semver,pattern={{version}}
          # Apps pin a version; no moving `latest`.
          flavor: latest=false

      # The sidecar's unit tests run inside this build (see its Dockerfile).
      - uses: docker/build-push-action@v7
        with:
          context: ocr-sidecar
          platforms: linux/amd64
          load: true
          tags: transaction-verification-ocr:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read a drawn receipt end to end
        run: |
          docker run -d --name ocr transaction-verification-ocr:test
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ocr)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ocr)" = healthy ] || { docker logs ocr; exit 1; }
          docker exec -i ocr python - < ocr-sidecar/smoke_test.py

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build, from the cache: the pushed image is the one just tested.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: ocr-sidecar
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
